# Conservative X11 compositor settings for the integrated Radeon GPU in AMD A4 APUs.
backend = "xrender";
vsync = false;
use-damage = true;
refresh-rate = 0;

# Gentle visual polish without expensive blur or full-window shadows.
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
shadow = false;
blur-method = "none";
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
